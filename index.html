<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Mundo dos Poliedros - 5.º Ano</title>
    <script src="https://cloudflare.com"></script>
    <style>
        :root { --azul: #3498db; --verde: #2ecc71; --laranja: #e67e22; --vermelho: #e74c3c; --fundo: #f0f9ff; }
        body { font-family: 'Comic Sans MS', cursive; background: var(--fundo); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #app-container { background: white; width: 95%; max-width: 850px; border-radius: 20px; padding: 25px; border: 5px solid var(--azul); text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .btn { padding: 12px 30px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; border: none; color: white; font-weight: bold; margin: 10px; transition: 0.3s; }
        .btn-estudar { background: var(--verde); }
        .btn-quiz { background: var(--laranja); }
        #canvas-3d { width: 100%; height: 350px; background: #ffffff; border-radius: 15px; margin: 15px 0; border: 2px solid #ddd; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #e8f4fd; padding: 15px; border-radius: 10px; font-size: 1.1rem; }
        .stats-quiz { display: flex; justify-content: space-around; background: #eee; padding: 10px; border-radius: 15px; margin-bottom: 15px; font-weight: bold; }
        .opcoes-quiz { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-opcao { background: var(--azul); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-opcao:hover { background: #2980b9; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- ECRÃ INICIAL -->
    <div id="ecra-inicial">
        <h1>Bem-vindos ao mundo dos poliedros! 🧊</h1>
        <p>Aprende e diverte-te com a Matemática!</p>
        <button class="btn btn-estudar" onclick="irPara('estudar')">Estudar</button>
        <button class="btn btn-quiz" onclick="irPara('quiz')">Quiz (100 Desafios)</button>
    </div>

    <!-- ECRÃ ESTUDAR -->
    <div id="ecra-estudar" class="hidden">
        <h2>Explorador 3D 🔍</h2>
        <select id="seletor-solido" onchange="atualizarSolido()" style="padding:10px; border-radius:10px; width:80%;">
            <optgroup label="Prismas">
                <option value="p3">Prisma Triangular</option>
                <option value="p4">Cubo (Prisma Quadrangular)</option>
                <option value="p5">Prisma Pentagonal</option>
                <option value="p6">Prisma Hexagonal</option>
                <option value="p8">Prisma Octogonal</option>
            </optgroup>
            <optgroup label="Pirâmides">
                <option value="pi3">Pirâmide Triangular</option>
                <option value="pi4">Pirâmide Quadrangular</option>
                <option value="pi5">Pirâmide Pentagonal</option>
                <option value="pi6">Pirâmide Hexagonal</option>
                <option value="pi8">Pirâmide Octogonal</option>
            </optgroup>
            <optgroup label="Sólidos Platónicos">
                <option value="sp4">Tetraedro</option>
                <option value="sp6">Cubo (Hexaedro)</option>
                <option value="sp8">Octaedro</option>
                <option value="sp12">Dodecaedro</option>
                <option value="sp20">Icosaedro</option>
            </optgroup>
        </select>
        <div id="canvas-3d"></div>
        <div class="info-grid" id="info-detalhes"></div>
        <button class="btn" style="background:#95a5a6" onclick="irPara('inicial')">Voltar</button>
    </div>

    <!-- ECRÃ QUIZ -->
    <div id="ecra-quiz" class="hidden">
        <div class="stats-quiz">
            <span style="color:var(--verde)">Certas: <span id="count-certo">0</span></span>
            <span id="quiz-progresso">Pergunta 1/100</span>
            <span style="color:var(--vermelho)">Erradas: <span id="count-errado">0</span></span>
        </div>
        <div id="pergunta-texto" style="font-size: 1.2rem; margin: 20px 0; font-weight: bold;"></div>
        <div class="opcoes-quiz" id="quiz-opcoes"></div>
        <div id="quiz-feedback" style="margin-top: 15px; font-weight: bold;"></div>
        <button class="btn" style="background:#95a5a6; margin-top:20px;" onclick="irPara('inicial')">Sair</button>
    </div>
</div>

<script>
    let scene, camera, renderer, currentMesh;
    let certas = 0, erradas = 0, qAtual = 0, bancoPerguntas = [];

    // --- SISTEMA 3D ---
    function init3D() {
        const container = document.getElementById('canvas-3d');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        camera = new THREE.PerspectiveCamera(75, container.clientWidth / 350, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, 350);
        container.appendChild(renderer.domElement);

        const light1 = new THREE.DirectionalLight(0xffffff, 1);
        light1.position.set(5, 5, 5);
        scene.add(light1, new THREE.AmbientLight(0x404040));
        camera.position.z = 5;

        // Rotação com rato
        let isDragging = false;
        renderer.domElement.onmousedown = () => isDragging = true;
        window.onmouseup = () => isDragging = false;
        window.onmousemove = (e) => {
            if(isDragging && currentMesh) {
                currentMesh.rotation.y += e.movementX * 0.01;
                currentMesh.rotation.x += e.movementY * 0.01;
            }
        };
        animate();
    }

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }

    function atualizarSolido() {
        if(currentMesh) scene.remove(currentMesh);
        const v = document.getElementById('seletor-solido').value;
        let geo, info = {};

        if(v.startsWith('pi')) {
            let n = parseInt(v.substring(2)); 
            geo = new THREE.ConeGeometry(1.5, 2.5, n); 
            info = {f:n+1, v:n+1, a:2*n};
        } else if(v.startsWith('p')) {
            let n = parseInt(v.substring(1)); 
            geo = new THREE.CylinderGeometry(1.5, 1.5, 2.5, n); 
            info = {f:n+2, v:2*n, a:3*n};
        } else {
            let n = parseInt(v.substring(2));
            if(n==4) { geo = new THREE.TetrahedronGeometry(1.8); info={f:4,v:4,a:6}; }
            if(n==6) { geo = new THREE.BoxGeometry(1.8,1.8,1.8); info={f:6,v:8,a:12}; }
            if(n==8) { geo = new THREE.OctahedronGeometry(1.8); info={f:8,v:6,a:12}; }
            if(n==12) { geo = new THREE.DodecahedronGeometry(1.8); info={f:12,v:20,a:30}; }
            if(n==20) { geo = new THREE.IcosahedronGeometry(1.8); info={f:20,v:12,a:30}; }
        }

        const mat = new THREE.MeshPhongMaterial({ color: 0x3498db, flatShading: true });
        currentMesh = new THREE.Mesh(geo, mat);
        const edg = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color:0x000000}));
        currentMesh.add(edg);
        scene.add(currentMesh);

        document.getElementById('info-detalhes').innerHTML = `<div>Faces: ${info.f}</div><div>Vértices: ${info.v}</div><div>Arestas: ${info.a}</div>`;
    }

    // --- QUIZ (100 Perguntas) ---
    function gerarBanco() {
        let p = [
            {q: "O que é um poliedro?", opts: ["Tem curvas", "Só superfícies planas", "É redondo", "É um círculo"], r: 1},
            {q: "Quantas bases tem um prisma?", opts: ["1", "2", "3", "0"], r: 1},
            {q: "Uma pirâmide pentagonal tem quantas bases?", opts: ["1", "2", "5", "0"], r: 0},
            {q: "O encontro de duas faces chama-se...", opts: ["Vértice", "Aresta", "Base", "Lado"], r: 1},
            {q: "Qual destes é um Sólido Platónico?", opts: ["Cubo", "Prisma Hexagonal", "Pirâmide", "Esfera"], r: 0},
            {q: "Quantas faces tem o Icosaedro?", opts: ["12", "20", "8", "6"], r: 1},
            {q: "O Dodecaedro tem faces com que forma?", opts: ["Triângulos", "Quadrados", "Pentágonos", "Hexágonos"], r: 2},
            {q: "Relação de Euler: V + F =", opts: ["A", "A + 1", "A + 2", "A - 2"], r: 2}
        ];
        // Gerar variações para chegar a 100
        while(p.length < 100) { p.push(p[Math.floor(Math.random()*p.length)]); }
        return p.sort(() => Math.random() - 0.5);
    }

    function irPara(ecra) {
        document.querySelectorAll('#app-container > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('ecra-' + ecra).classList.remove('hidden');
        if(ecra === 'estudar') { if(!renderer) init3D(); atualizarSolido(); }
        if(ecra === 'quiz') { qAtual = 0; certas = 0; erradas = 0; bancoPerguntas = gerarBanco(); atualizarStats(); mostrarPergunta(); }
    }

    function mostrarPergunta() {
        if(qAtual >= 100) { document.getElementById('pergunta-texto').innerText = "Fim! Parabéns!"; return; }
        const p = bancoPerguntas[qAtual];
        document.getElementById('quiz-progresso').innerText = `Pergunta ${qAtual+1}/100`;
        document.getElementById('pergunta-texto').innerText = p.q;
        const optDiv = document.getElementById('quiz-opcoes');
        optDiv.innerHTML = "";
        p.opts.forEach((o, i) => {
            const btn = document.createElement('button');
            btn.className = 'btn-opcao';
            btn.innerText = o;
            btn.onclick = () => {
                if(i === p.r) { certas++; document.getElementById('quiz-feedback').innerText = "✅ Certo!"; }
                else { erradas++; document.getElementById('quiz-feedback').innerText = "❌ Errado!"; }
                atualizarStats();
                setTimeout(() => { qAtual++; mostrarPergunta(); }, 1000);
            };
            optDiv.appendChild(btn);
        });
        document.getElementById('quiz-feedback').innerText = "";
    }

    function atualizarStats() {
        document.getElementById('count-certo').innerText = certas;
        document.getElementById('count-errado').innerText = erradas;
    }
</script>
</body>
</html>
