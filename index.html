<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Mundo dos Poliedros - 5.º Ano</title>
    <script src="https://unpkg.com"></script>
    <style>
        :root { --azul: #3498db; --verde: #2ecc71; --laranja: #f39c12; --vermelho: #e74c3c; --fundo: #f0f9ff; }
        body { font-family: 'Comic Sans MS', cursive; background: var(--fundo); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #app-container { background: white; width: 95%; max-width: 800px; border-radius: 20px; padding: 20px; border: 5px solid var(--azul); text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .btn { padding: 12px 25px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; border: none; color: white; font-weight: bold; margin: 10px; transition: 0.3s; }
        .btn-estudar { background: var(--verde); }
        .btn-quiz { background: var(--laranja); }
        #canvas-3d { width: 100%; height: 350px; background: #fafafa; border-radius: 15px; margin: 15px 0; border: 2px solid #ddd; display: block; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #e8f4fd; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; }
        .stats-quiz { display: flex; justify-content: space-around; background: #eee; padding: 10px; border-radius: 15px; margin-bottom: 15px; font-weight: bold; }
        .opcoes-quiz { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-opcao { background: var(--azul); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-opcao:hover { background: #2980b9; transform: scale(1.02); }
    </style>
</head>
<body>

<div id="app-container">
    <div id="ecra-inicial">
        <h1>Bem-vindos ao mundo dos poliedros! 🧊</h1>
        <p>Explora os sólidos e diverte-te com o Quiz!</p>
        <button class="btn btn-estudar" onclick="irPara('estudar')">Estudar</button>
        <button class="btn btn-quiz" onclick="irPara('quiz')">Quiz Aleatório</button>
    </div>

    <div id="ecra-estudar" class="hidden">
        <h2>Simulador de Sólidos 🔍</h2>
        <select id="seletor-solido" onchange="atualizarSolido()" style="padding:10px; border-radius:10px; width:85%; margin-bottom:10px;">
            <optgroup label="Prismas"><option value="p3">Prisma Triangular</option><option value="p4">Cubo</option><option value="p6">Prisma Hexagonal</option><option value="p8">Prisma Octogonal</option></optgroup>
            <optgroup label="Pirâmides"><option value="pi3">Pirâmide Triangular</option><option value="pi4">Pirâmide Quadrangular</option><option value="pi6">Pirâmide Hexagonal</option><option value="pi8">Pirâmide Octogonal</option></optgroup>
            <optgroup label="Platónicos"><option value="sp4">Tetraedro</option><option value="sp8">Octaedro</option><option value="sp12">Dodecaedro</option><option value="sp20">Icosaedro</option></optgroup>
        </select>
        <div id="canvas-3d"></div>
        <div class="info-grid" id="info-detalhes"></div>
        <button class="btn" style="background:#95a5a6" onclick="irPara('inicial')">Voltar</button>
    </div>

    <div id="ecra-quiz" class="hidden">
        <div class="stats-quiz">
            <span style="color:var(--verde)">Certas: <span id="count-certo">0</span></span>
            <span id="quiz-progresso">Pergunta 1/100</span>
            <span style="color:var(--vermelho)">Erradas: <span id="count-errado">0</span></span>
        </div>
        <div id="pergunta-texto" style="font-size: 1.2rem; margin: 20px 0; font-weight: bold; min-height: 50px;"></div>
        <div class="opcoes-quiz" id="quiz-opcoes"></div>
        <div id="quiz-feedback" style="margin-top: 15px; font-weight: bold;"></div>
        <button class="btn" style="background:#95a5a6; margin-top:20px;" onclick="irPara('inicial')">Sair</button>
    </div>
</div>

<script>
    let scene, camera, renderer, currentMesh;
    let certas = 0, erradas = 0, qAtual = 0, perguntasQuiz = [];

    // --- LÓGICA 3D ---
    function init3D() {
        const container = document.getElementById('canvas-3d');
        if (renderer) return;
        scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
        camera = new THREE.PerspectiveCamera(50, container.clientWidth / 350, 0.1, 1000);
        camera.position.z = 7;
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, 350);
        container.appendChild(renderer.domElement);
        const light = new THREE.DirectionalLight(0xffffff, 1.2); light.position.set(5, 5, 5);
        scene.add(light, new THREE.AmbientLight(0x404040, 1.5));
        animate();
    }
    function animate() { requestAnimationFrame(animate); if(currentMesh) currentMesh.rotation.y += 0.01; if(renderer) renderer.render(scene, camera); }

    function atualizarSolido() {
        if (currentMesh) scene.remove(currentMesh);
        const v = document.getElementById('seletor-solido').value;
        let geo, info = {};
        if(v.startsWith('pi')) { let n = parseInt(v.substring(2)); geo = new THREE.ConeGeometry(1.8, 2.8, n); info = {f:n+1,v:n+1,a:2*n}; }
        else if(v.startsWith('p')) { let n = parseInt(v.substring(1)); geo = new THREE.CylinderGeometry(1.6, 1.6, 2.5, n); info = {f:n+2,v:2*n,a:3*n}; }
        else {
            let n = parseInt(v.substring(2));
            if(n==4) { geo = new THREE.TetrahedronGeometry(2); info={f:4,v:4,a:6}; }
            else if(n==8) { geo = new THREE.OctahedronGeometry(2); info={f:8,v:6,a:12}; }
            else if(n==12) { geo = new THREE.DodecahedronGeometry(2); info={f:12,v:20,a:30}; }
            else if(n==20) { geo = new THREE.IcosahedronGeometry(2); info={f:20,v:12,a:30}; }
        }
        currentMesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ color: 0x3498db, flatShading: true }));
        currentMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 })));
        scene.add(currentMesh);
        document.getElementById('info-detalhes').innerHTML = `<div>Faces: ${info.f}</div><div>Vértices: ${info.v}</div><div>Arestas: ${info.a}</div><div>Euler: ${info.v}+${info.f}=${info.a+2}</div>`;
    }

    // --- LÓGICA DO QUIZ ALEATÓRIO ---
    function irPara(ecra) {
        document.querySelectorAll('#app-container > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('ecra-' + ecra).classList.remove('hidden');
        
        if(ecra === 'estudar') { requestAnimationFrame(() => { init3D(); atualizarSolido(); }); }
        
        if(ecra === 'quiz') { 
            certas = 0; erradas = 0; qAtual = 0; 
            
            // Criar banco de 100 perguntas baseado na estrutura original
            let base = [
                {q: "O que é um poliedro?", opts: ["Tem partes curvas", "Só superfícies planas", "É redondo", "É um círculo"], r: 1},
                {q: "Quantas bases tem um prisma?", opts: ["Uma", "Duas", "Três", "Nenhuma"], r: 1},
                {q: "As faces laterais de uma pirâmide são...", opts: ["Quadrados", "Retângulos", "Triângulos", "Círculos"], r: 2},
                {q: "O ponto onde se encontram as arestas chama-se...", opts: ["Face", "Vértice", "Base", "Lado"], r: 1},
                {q: "O cubo tem quantas faces?", opts: ["4", "6", "8", "12"], r: 1},
                {q: "Qual destes é um sólido platónico?", opts: ["Cilindro", "Cone", "Octaedro", "Prisma"], r: 2},
                {q: "Quantas arestas tem uma pirâmide quadrangular?", opts: ["4", "5", "8", "12"], r: 2},
                {q: "O Icosaedro tem quantas faces?", opts: ["12", "20", "30", "10"], r: 1}
            ];

            perguntasQuiz = [];
            while(perguntasQuiz.length < 100) { 
                let pClone = JSON.parse(JSON.stringify(base[Math.floor(Math.random()*base.length)]));
                perguntasQuiz.push(pClone); 
            }

            // MISTURA AS PERGUNTAS (SHUFFLE)
            for (let i = perguntasQuiz.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [perguntasQuiz[i], perguntasQuiz[j]] = [perguntasQuiz[j], perguntasQuiz[i]];
            }
            
            atualizarStats(); 
            mostrarPergunta(); 
        }
    }

    function mostrarPergunta() {
        if(qAtual >= 100) { document.getElementById('pergunta-texto').innerText = "Parabéns! Terminaste o desafio!"; return; }
        const p = perguntasQuiz[qAtual];
        document.getElementById('quiz-progresso').innerText = `Pergunta ${qAtual+1}/100`;
        document.getElementById('pergunta-texto').innerText = p.q;
        const div = document.getElementById('quiz-opcoes'); div.innerHTML = "";
        p.opts.forEach((o, i) => {
            const b = document.createElement('button'); b.className = 'btn-opcao'; b.innerText = o;
            b.onclick = () => {
                if(i === p.r) { certas++; document.getElementById('quiz-feedback').innerText = "✅ Certo!"; }
                else { erradas++; document.getElementById('quiz-feedback').innerText = "❌ Errado! Era: " + p.opts[p.r]; }
                atualizarStats(); setTimeout(() => { qAtual++; mostrarPergunta(); }, 1200);
            };
            div.appendChild(b);
        });
        document.getElementById('quiz-feedback').innerText = "";
    }

    function atualizarStats() {
        document.getElementById('count-certo').innerText = certas;
        document.getElementById('count-errado').innerText = erradas;
    }
</script>
</body>
</html>
