<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Mundo dos Poliedros Interativo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --azul: #3498db; --verde: #2ecc71; --laranja: #e67e22; --fundo: #f0f9ff; }
        body { font-family: 'Comic Sans MS', cursive; background: var(--fundo); margin: 0; text-align: center; }
        #app-container { background: white; width: 90%; max-width: 900px; margin: 20px auto; border-radius: 20px; padding: 20px; border: 5px solid var(--azul); }
        .hidden { display: none; }
        .btn { padding: 12px 30px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; border: none; color: white; font-weight: bold; margin: 5px; transition: 0.2s; }
        .btn-estudar { background: var(--verde); }
        .btn-quiz { background: var(--laranja); }
        #canvas-3d { width: 100%; height: 400px; background: #eee; border-radius: 15px; cursor: move; margin: 15px 0; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #e8f4fd; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="ecra-inicial">
        <h1>Bem-vindos ao mundo dos poliedros! 🧊</h1>
        <p>O que queres fazer?</p>
        <button class="btn btn-estudar" onclick="irPara('estudar')">Estudar</button>
        <button class="btn btn-quiz" onclick="irPara('quiz')">Quiz</button>
    </div>

    <div id="ecra-estudar" class="hidden">
        <h2>Explorador 3D 🔍</h2>
        <select id="seletor-solido" onchange="atualizarSolido()" style="padding: 10px; border-radius: 10px; font-size: 1rem;">
            <optgroup label="Prismas">
                <option value="p3">Prisma Triangular</option>
                <option value="p4">Cubo (Prisma Quadrangular)</option>
                <option value="p5">Prisma Pentagonal</option>
                <option value="p6">Prisma Hexagonal</option>
                <option value="p7">Prisma Heptagonal</option>
                <option value="p8">Prisma Octogonal</option>
            </optgroup>
            <optgroup label="Pirâmides">
                <option value="pi3">Pirâmide Triangular</option>
                <option value="pi4">Pirâmide Quadrangular</option>
                <option value="pi5">Pirâmide Pentagonal</option>
                <option value="pi6">Pirâmide Hexagonal</option>
                <option value="pi7">Pirâmide Heptagonal</option>
                <option value="pi8">Pirâmide Octogonal</option>
            </optgroup>
            <optgroup label="Sólidos Platónicos">
                <option value="sp4">Tetraedro</option>
                <option value="sp6">Hexaedro (Cubo)</option>
                <option value="sp8">Octaedro</option>
                <option value="sp12">Dodecaedro</option>
                <option value="sp20">Icosaedro</option>
            </optgroup>
        </select>

        <div id="canvas-3d"></div>

        <div class="info-grid" id="info-detalhes">
            <!-- Preenchido por JS -->
        </div>
        <button class="btn" style="background:#95a5a6" onclick="irPara('inicial')">Voltar</button>
    </div>
</div>

<script>
    let scene, camera, renderer, currentMesh;
    const container = document.getElementById('canvas-3d');

    function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        camera = new THREE.PerspectiveCamera(75, container.clientWidth / 400, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, 400);
        container.appendChild(renderer.domElement);
        
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));
        
        camera.position.z = 5;
        animate();
        
        // Interatividade de rotação com o rato
        let isDragging = false;
        container.onmousedown = () => isDragging = true;
        window.onmouseup = () => isDragging = false;
        window.onmousemove = (e) => {
            if(isDragging && currentMesh) {
                currentMesh.rotation.y += e.movementX * 0.01;
                currentMesh.rotation.x += e.movementY * 0.01;
            }
        };
    }

    function animate() {
        requestAnimationFrame(animate);
        if(currentMesh && !window.isDragging) {
            currentMesh.rotation.y += 0.005;
        }
        renderer.render(scene, camera);
    }

    function atualizarSolido() {
        if(currentMesh) scene.remove(currentMesh);
        const val = document.getElementById('seletor-solido').value;
        let geo;
        let info = { f:0, v:0, a:0 };

        // Lógica de Geometria
        if(val.startsWith('p')) { // Prismas
            const n = parseInt(val.substring(1));
            geo = new THREE.CylinderGeometry(1.5, 1.5, 2, n);
            info = { f: n+2, v: 2*n, a: 3*n };
        } else if(val.startsWith('pi')) { // Pirâmides
            const n = parseInt(val.substring(2));
            geo = new THREE.ConeGeometry(1.5, 2.5, n);
            info = { f: n+1, v: n+1, a: 2*n };
        } else { // Platónicos
            const n = parseInt(val.substring(2));
            if(n==4) geo = new THREE.TetrahedronGeometry(1.5);
            if(n==6) geo = new THREE.BoxGeometry(1.8, 1.8, 1.8);
            if(n==8) geo = new THREE.OctahedronGeometry(1.5);
            if(n==12) geo = new THREE.DodecahedronGeometry(1.5);
            if(n==20) geo = new THREE.IcosahedronGeometry(1.5);
            // Dados simplificados para platónicos
            const plat = {4:[4,4,6], 6:[6,8,12], 8:[8,6,12], 12:[12,20,30], 20:[20,12,30]};
            info = { f: plat[n][0], v: plat[n][1], a: plat[n][2] };
        }

        const mat = new THREE.MeshNormalMaterial({ wireframe: false });
        currentMesh = new THREE.Mesh(geo, mat);
        scene.add(currentMesh);

        document.getElementById('info-detalhes').innerHTML = `
            <div><strong>Faces:</strong> ${info.f}</div>
            <div><strong>Vértices:</strong> ${info.v}</div>
            <div><strong>Arestas:</strong> ${info.a}</div>
            <div><strong>Sólido:</strong> ${document.getElementById('seletor-solido').options[document.getElementById('seletor-solido').selectedIndex].text}</div>
        `;
    }

    function irPara(ecra) {
        document.getElementById('ecra-inicial').classList.add('hidden');
        document.getElementById('ecra-estudar').classList.add('hidden');
        if(ecra === 'estudar') {
            document.getElementById('ecra-estudar').classList.remove('hidden');
            if(!scene) init3D();
            atualizarSolido();
        } else {
            document.getElementById('ecra-inicial').classList.remove('hidden');
        }
    }
</script>
</body>
</html>
